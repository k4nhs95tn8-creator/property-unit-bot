name: Weekly official DLD unit database
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'
permissions:
  contents: write
concurrency:
  group: dld-public-download
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: data-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test conversion and conservative matching
        run: python3 -m unittest discover -s tests
      - name: Download official public DLD units from this cloud runner
        run: python3 update_data.py --source bulk --data-dir cloud-output
      - name: Export all compatible Seslia candidates
        run: python3 check_listing.py --database cloud-output/units.sqlite --output cloud-output/seslia-result.json
      - name: Compress and checksum the complete database
        run: python3 cloud/export_manifest.py
      - name: Publish validated database and candidate report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" cloud-output/units.sqlite.gz cloud-output/manifest.json cloud-output/seslia-result.json --draft --title "Official DLD units $RELEASE_TAG" --notes "Dubai Land Department public open unit data via Dubai Pulse. All source rows and columns retained. Candidate matches are not verified advert identities. Source record freshness is unknown."
          gh release edit "$RELEASE_TAG" --draft=false --latest
